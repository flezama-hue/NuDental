services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: nudental_local
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: nudental_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - nudental_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nudental_local -d nudental_local"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  nudental_pgdata:
