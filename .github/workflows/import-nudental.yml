name: Importar proyecto NuDental

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-nudental.yml

permissions:
  contents: write

jobs:
  import-project:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Descargar paquete fuente validado
        env:
          SOURCE_URL_B64: 
          REPORT_URL_B64: 
        run: |
          set -euo pipefail
          SOURCE_URL="$(printf '%s' "$SOURCE_URL_B64" | base64 --decode)"
          REPORT_URL="$(printf '%s' "$REPORT_URL_B64" | base64 --decode)"
          curl --fail --location --retry 3 "$SOURCE_URL" --output /tmp/nudental-source.zip
          curl --fail --location --retry 3 "$REPORT_URL" --output /tmp/nudental-report.docx
          mkdir -p /tmp/nudental-source
          unzip -q /tmp/nudental-source.zip -d /tmp/nudental-source
          test -f /tmp/nudental-source/NuDental/package.json
          test -s /tmp/nudental-report.docx

      - name: Materializar proyecto en la raíz
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/import-nudental.yml' \
            /tmp/nudental-source/NuDental/ ./
          mkdir -p docs
          cp /tmp/nudental-report.docx docs/Informe_Detallado_Implementacion_NuDental_Vistas_1_y_2.docx
          rm -rf .import-parts
          rm -f .github/workflows/import-nudental.yml

      - name: Confirmar importación
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'feat: publicar proyecto NuDental completo'
          git push origin HEAD:main
